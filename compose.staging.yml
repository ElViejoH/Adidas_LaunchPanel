services:
  launch-panel:
    build:
      context: .
      args:
        VITE_API_URL: /api
    image: adidas-launch-panel:staging
    ports:
      - "${STAGING_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/data/staging.db
      JWT_SECRET: ${STAGING_JWT_SECRET:?Define STAGING_JWT_SECRET in .env.staging}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${STAGING_ORIGIN:-http://localhost:4000}
      SERVE_FRONTEND: "true"
      FRONTEND_DIST_PATH: /app/frontend/dist
      SEED_DATABASE: ${SEED_DATABASE:-true}
    volumes:
      - staging_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  staging_data:
