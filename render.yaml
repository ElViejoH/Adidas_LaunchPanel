services:
  - type: web
    name: adidas-launch-panel-staging
    runtime: docker
    repo: https://github.com/ElViejoH/Adidas_LaunchPanel
    branch: main
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    initialDeployHook: npm run db:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/staging.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_DIST_PATH
        value: /app/frontend/dist
      - key: SEED_DATABASE
        value: "false"
    disk:
      name: staging-data
      mountPath: /data
      sizeGB: 1
